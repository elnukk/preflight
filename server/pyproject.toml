[project]
name = "preflight-mcp"
version = "0.1.0"
description = "MCP server for the Preflight compute-efficiency plugin"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6",
    "psutil>=5.9",
    "nvidia-ml-py>=13.615.71",
]

[project.scripts]
preflight-mcp = "preflight_mcp.server:main"
preflight-record = "preflight_mcp.record:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight_mcp"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
